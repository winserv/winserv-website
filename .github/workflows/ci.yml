# The site's merge gate (spec 2026-10-08 §8). It never publishes: the VM has no GitHub access.
name: CI

on:
  pull_request:
  push:
    branches: [main, astro]

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0: tests/source.test.mjs compares src/pages/ with tag pre-i18n, and a shallow
      # clone has no tags (spec 2026-10-08 sub-project 3 §9).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
