# The Winserv site's only server (spec 2026-10-08 §3), modelled on winserv-unifi-portal's
# docker/marketing-nginx.conf and its lessons:
# - nginx reads this file only when it starts: after a change, `up -d --force-recreate`.
# - single-file bind mount: write it in place (cp, tee, scp, rsync --inplace), never mv or sed -i.
# - no log_format / access_log: the default `combined` carries $http_referer, which
#   deploy/site-stats.awk reads (tests/deploy.test.mjs holds this).
server {
    listen       8080;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    # Behind the edge the peer is the reverse proxy, so nginx would log the proxy's address.
    # The privacy notice says the log keeps the visitor's IP; take it from X-Forwarded-For,
    # trusted only from the proxy's network.
    set_real_ip_from 172.18.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header Cache-Control "no-cache" always;

    error_page 403 404 =404 /404.html;
    error_page 400 405 413 414 500 502 503 504 /error.html;

    location / {
        # GitHub Pages answered /contato with contato.html; links shared that way keep working.
        try_files $uri $uri.html $uri/ =404;
    }

    # One block per language (spec 2026-10-08 sub-project 3 §8): its own 404. The error.html
    # line repeats the server's: needed if an error_page here cancels the inherited ones (nginx
    # documentation, not re-read when written), a harmless repeat if it does not.
    # /en without the slash never reaches these blocks: try_files' directory test answers a
    # native 301 to /en/ (measured on /images, 2026-10-08) — no `return 301` (AI Portal gate).
    location ^~ /en/ {
        error_page 403 404 =404 /en/404.html;
        error_page 400 405 413 414 500 502 503 504 /error.html;
        try_files $uri $uri.html $uri/ =404;
    }
    location = /en/404.html { internal; }
    location = /en/404 { return 404; }

    location ^~ /es/ {
        error_page 403 404 =404 /es/404.html;
        error_page 400 405 413 414 500 502 503 504 /error.html;
        try_files $uri $uri.html $uri/ =404;
    }
    location = /es/404.html { internal; }
    location = /es/404 { return 404; }

    location = /e/contato-email { return 204; }

    # Archived AI Portal (2026-09-28, declared reversible): 302 — a 301 is cached for good.
    location = /winserv-ai-portal.html { return 302 /; }
    location = /winserv-ai-portal-tecnico.html { return 302 /; }
    location = /winserv-ai-portal/winserv-ai-portal-facts.html { return 302 /; }

    location = /404.html { internal; }
    location = /error.html { internal; }
    # By name without .html, try_files above would serve them with a 200 (measured 2026-10-08).
    location = /404 { return 404; }
    location = /error { return 404; }

    # Before the dotfile rule: .well-known/winserv-license/sagres-validation.json is published.
    location ^~ /.well-known/ { }

    location ~ /\. { return 404; }
}
